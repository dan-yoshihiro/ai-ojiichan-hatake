<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">フォロワー1人から129人までの実測推移</title>
  <desc id="d">2026年4月4日の1人から、6月19日に100人、8月12日に129人へ推移したフォロワー数の記録。7月17日の126人から8月1日に123人へ下がり、その後129人になった変動も含む。</desc>
  <style>
    .ax{stroke:#c3c2b7;stroke-width:1}.gr{stroke:#e1e0d9;stroke-width:1}
    .lbl{fill:#52514e;font-size:13px}.cap{fill:#52514e;font-size:12px}.now{fill:#0b0b0b;font-size:13px}
    @media (prefers-color-scheme: dark){.ax{stroke:#383835}.gr{stroke:#2c2c2a}.lbl{fill:#c3c2b7}.cap{fill:#c3c2b7}.now{fill:#ffffff}}
  </style>
  <line class="gr" x1="60" y1="215" x2="690" y2="215"/>
  <line class="gr" x1="60" y1="99" x2="690" y2="99" stroke-dasharray="4 4"/>
  <line class="ax" x1="60" y1="330" x2="690" y2="330"/>
  <line class="ax" x1="60" y1="30" x2="60" y2="330"/>
  <text class="lbl" x="52" y="219" text-anchor="end">50</text>
  <text class="lbl" x="52" y="103" text-anchor="end">100</text>
  <text class="lbl" x="52" y="334" text-anchor="end">0</text>
  <text class="lbl" x="60" y="352" text-anchor="middle">4/4</text>
  <text class="lbl" x="272" y="352" text-anchor="middle">5/18</text>
  <text class="lbl" x="484" y="352" text-anchor="middle">7/1</text>
  <text class="lbl" x="690" y="352" text-anchor="middle">8/12</text>
  <text class="cap" x="375" y="378" text-anchor="middle">観測日</text>
  <polyline fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
    points="60,328 94,316 128,314 162,293 196,288 230,235 264,194 298,173 331,157 365,134 399,106 433,99 467,85 501,81 535,69 569,37 603,44 637,46 671,39 690,32"/>
  <g stroke="#fcfcfb" stroke-width="2">
    <circle cx="60" cy="328" r="4.5" fill="#888780"/>
    <circle cx="430" cy="99" r="4.5" fill="#2a78d6"/>
    <circle cx="569" cy="37" r="4.5" fill="#eda100"/>
    <circle cx="637" cy="46" r="4.5" fill="#eda100"/>
    <circle cx="690" cy="32" r="5" fill="#199e70"/>
  </g>
  <text class="cap" x="430" y="86" text-anchor="middle">100人（6/19）</text>
  <text class="cap" x="602" y="63" text-anchor="middle">126 → 123</text>
  <text class="now" x="690" y="20" text-anchor="end">129人（8/12）</text>
</svg>
